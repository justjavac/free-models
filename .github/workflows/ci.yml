name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate JSON & type-check / build
        run: npm run build
      - name: Verify JSON endpoints exist
        run: |
          test -f public/api.json
          test -f public/models.json
          test -f public/catalog.json
