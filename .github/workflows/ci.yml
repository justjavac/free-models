name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (SSG + route handlers)
        run: npm run build
      - name: Verify static route endpoints are prerendered
        run: |
          test -f .next/server/app/catalog.json.body
          test -f .next/server/app/api.json.body
          test -f .next/server/app/models.json.body
          test -f .next/server/app/llms.txt.body
          test -f .next/server/app/llms-full.txt.body
          grep -q '"groq"' .next/server/app/api.json.body
